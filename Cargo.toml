[package]
name = "EverydayRSS"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
clap = { version = "4.6.1", features = ["derive","env"] }
feed-rs = { version = "2.4.0",features = ["sanitize"] }
reqwest = { version = "0.13.3",features = ["blocking"] }
tokio = { version = "1.53.1",features = ["macros"] }
urlencoding="2.1.3"