name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: linux-x86_64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: linux-aarch64
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            archive: macos-aarch64
          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify release tag
        shell: bash
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Cargo.toml version ($package_version) does not match tag ($GITHUB_REF_NAME)." >&2
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: |
          package="everydayrss-${GITHUB_REF_NAME}-${{ matrix.archive }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/everydayrss" "dist/$package/"
          cp README.md README.en.md LICENSE "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: everydayrss-${{ matrix.archive }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "EverydayRSS $GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi
